<!DOCTYPE html>
<html>
<head>
    <title>Test Form</title>
</head>
<body>
    <h1>Test Form</h1>
    <form method="POST" action="/usuarios/crear/">
        <input type="hidden" name="csrfmiddlewaretoken" value="test">
        
        <label>Rol:</label>
        <select name="rol" required>
            <option value="">Seleccionar...</option>
            <option value="administrador">Administrador</option>
            <option value="jefe_uycit">Jefe UYCIT</option>
            <option value="auxiliar">Auxiliar</option>
        </select>
        
        <label>Nombres:</label>
        <input type="text" name="nombres" required>
        
        <label>Apellidos:</label>
        <input type="text" name="apellidos" required>
        
        <label>Número de documento:</label>
        <input type="text" name="numero_documento" required>
        
        <label>Correo institucional:</label>
        <input type="email" name="correo_institucional" required>
        
        <label>Sede:</label>
        <select name="sede_asignacion" required>
            <option value="LP">La Paz</option>
            <option value="SC">Santa Cruz</option>
            <option value="CB">Cochabamba</option>
        </select>
        
        <label>Password:</label>
        <input type="password" name="password" required>
        
        <button type="submit">Crear Usuario</button>
    </form>
</body>
</html>
